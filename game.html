<!-- ========== 优化后的全屏功能 + 渲染适配（轻量化，不阻塞） ========== -->
<script>
(function() {
    "use strict";
    
    const docEl = document.documentElement;
    const requestFullscreen = docEl.requestFullscreen ||
        docEl.webkitRequestFullscreen ||
        docEl.msRequestFullscreen ||
        docEl.mozRequestFullScreen;
    const exitFullscreen = document.exitFullscreen ||
        document.webkitExitFullscreen ||
        document.msExitFullscreen ||
        document.mozCancelFullScreen;
    const fullscreenElement = () => document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.msFullscreenElement ||
        document.mozFullScreenElement;
    
    function notifyResize() {
        const canvas = document.getElementById('canvas');
        if (!canvas) return;
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        if (window.__AK12_RENDER_API__ && typeof window.__AK12_RENDER_API__.resize === 'function') {
            window.__AK12_RENDER_API__.resize(width, height);
        }
        if (window.renderer && typeof window.renderer.setSize === 'function') {
            window.renderer.setSize(width, height);
            if (window.camera && window.camera.aspect) {
                window.camera.aspect = width / height;
                window.camera.updateProjectionMatrix();
            }
        }
        window.dispatchEvent(new Event('resize'));
    }
    
    async function toggleFullscreen() {
        try {
            const isFull = !!fullscreenElement();
            if (isFull) {
                if (exitFullscreen) await exitFullscreen.call(document);
            } else {
                if (requestFullscreen) await requestFullscreen.call(docEl);
            }
        } catch (err) {
            console.warn('全屏切换失败:', err);
            try {
                if (fullscreenElement()) {
                    if (exitFullscreen) exitFullscreen.call(document);
                } else {
                    if (requestFullscreen) requestFullscreen.call(docEl);
                }
            } catch (e) {}
        }
    }
    
    function updateFullscreenButton() {
        const btn = document.getElementById('fullscreen-toggle');
        if (!btn) return;
        const isFull = !!fullscreenElement();
        btn.textContent = isFull ? '✖' : '⛶';
        if (isFull) btn.style.backgroundColor = 'rgba(255, 80, 40, 0.85)';
        else btn.style.backgroundColor = '';
    }
    
    function onFullscreenChange() {
        updateFullscreenButton();
        setTimeout(() => notifyResize(), 50);
        setTimeout(() => notifyResize(), 200);
    }
    
    const fullscreenEvents = ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange', 'mozfullscreenchange'];
    fullscreenEvents.forEach(evt => document.addEventListener(evt, onFullscreenChange));
    window.addEventListener('resize', () => notifyResize());
    
    const fullscreenBtn = document.getElementById('fullscreen-toggle');
    if (fullscreenBtn) {
        fullscreenBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFullscreen(); });
        fullscreenBtn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); }, { passive: false });
    }
    
    updateFullscreenButton();
    notifyResize();
})();
</script>

<!-- ========== 原有内联优化（音频、性能、SW）全部保留，且已做延迟执行优化 ========== -->
<script>
(function() {
    function runWhenReady(fn) {
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn);
        else fn();
    }

    // 枪口闪光对象池（需要等待 GameUtils 加载）
    runWhenReady(() => {
        function waitFor(prop, callback) {
            if (window[prop]) callback();
            else setTimeout(() => waitFor(prop, callback), 50);
        }
        waitFor('GameUtils', () => {
            const Gu = window.GameUtils;
            const flashPool = [];
            const POOL_SIZE = 5;
            let activeFlashes = new Set();
            
            for (let i = 0; i < POOL_SIZE; i++) {
                const light = new THREE.PointLight(0xff6600, 1.5, 8);
                light.visible = false;
                flashPool.push(light);
            }
            
            Gu.createMuzzleFlash = function(scene, position, oldFlash) {
                let light = flashPool.find(l => !l.visible);
                if (!light) {
                    light = flashPool[0];
                    if (light.parent) light.parent.remove(light);
                    clearTimeout(light._timer);
                }
                light.position.copy(position);
                light.visible = true;
                scene.add(light);
                activeFlashes.add(light);
                
                if (light._timer) clearTimeout(light._timer);
                light._timer = setTimeout(() => {
                    if (light.parent) light.parent.remove(light);
                    light.visible = false;
                    activeFlashes.delete(light);
                }, 50);
                return light;
            };
            
            window.addEventListener('beforeunload', () => {
                flashPool.forEach(l => { if (l.parent) l.parent.remove(l); clearTimeout(l._timer); });
            });
        });
    });

    // 音频系统（延迟激活监听，避免阻塞首次交互）
    runWhenReady(() => {
        let audioCtx = null, gainNode = null, gunshotBuffer = null;
        let active = false, lastShotTime = 0;
        const MIN_GAP = 85;

        function createGunshotBuffer() {
            if (!audioCtx) return null;
            const dur = 0.2, rate = audioCtx.sampleRate;
            const len = rate * dur;
            const buffer = audioCtx.createBuffer(1, len, rate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < len; i++) {
                let t = i / rate;
                let env = t < 0.008 ? t / 0.008 : Math.exp(-(t - 0.008) * 24);
                let imp = Math.sin(2 * Math.PI * 170 * t) * 0.4;
                let noise = (Math.random() * 2 - 1) * 0.95;
                let s = (noise * 0.9 + imp * 0.25) * env;
                data[i] = Math.min(0.99, Math.max(-0.99, s));
            }
            return buffer;
        }

        function playGunshot() {
            if (!active || !audioCtx || !gunshotBuffer || audioCtx.state !== 'running') return;
            const now = performance.now();
            if (now - lastShotTime < MIN_GAP) return;
            lastShotTime = now;
            const src = audioCtx.createBufferSource();
            src.buffer = gunshotBuffer;
            src.connect(gainNode);
            src.start();
            src.onended = () => src.disconnect();
        }

        function activate() {
            if (active) return;
            if (!audioCtx) {
                const A = window.AudioContext || window.webkitAudioContext;
                if (!A) return;
                audioCtx = new A();
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.52;
                gainNode.connect(audioCtx.destination);
                gunshotBuffer = createGunshotBuffer();
            }
            if (audioCtx.state === 'running') active = true;
            else audioCtx.resume().then(() => active = true).catch(() => {});
        }

        let lastAmmo = null;
        function observeAmmo() {
            const el = document.getElementById('ammo');
            if (!el) { setTimeout(observeAmmo, 300); return; }
            const getAmmo = () => {
                const m = (el.textContent || el.innerText).match(/^(\d+)\//);
                return m ? parseInt(m[1], 10) : null;
            };
            lastAmmo = getAmmo();
            new MutationObserver(() => {
                const cur = getAmmo();
                if (cur !== null && lastAmmo !== null && cur < lastAmmo) playGunshot();
                lastAmmo = cur;
            }).observe(el, { childList: true, characterData: true, subtree: true, attributes: true });
        }

        function bindActivation() {
            const sel = ['#fire-button', '#reload-button', '#equip-button', '#aim-button', '#btn-jump', '#btn-crouch', '#btn-prone', '#joystick-base', '#canvas', '#sky-toggle', '#perf-toggle', '#edit-toggle', '#toggle-panel', '#fullscreen-toggle'];
            const once = () => {
                activate();
                sel.forEach(s => { let e = document.querySelector(s); e && (e.removeEventListener('touchstart', once), e.removeEventListener('mousedown', once)); });
                document.removeEventListener('touchstart', once);
                document.removeEventListener('mousedown', once);
            };
            sel.forEach(s => { let e = document.querySelector(s); e && (e.addEventListener('touchstart', once, { passive: true }), e.addEventListener('mousedown', once)); });
            document.addEventListener('touchstart', once, { passive: true });
            document.addEventListener('mousedown', once);
        }

        requestIdleCallback ? requestIdleCallback(() => { bindActivation(); observeAmmo(); }, { timeout: 2000 }) : setTimeout(() => { bindActivation(); observeAmmo(); }, 1500);
    });

    // 自动性能优化系统（延迟启动，不干扰首屏）
    runWhenReady(() => {
        const TARGET_FPS = 50;
        const SAMPLE_INTERVAL_MS = 2000;
        const LOW_FPS_COUNT_THRESHOLD = 3;
        const HIGH_FPS_COUNT_THRESHOLD = 2;
        const CHECK_DELAY_AFTER_CHANGE = 5000;

        let fpsSamples = [];
        let lastFrameTime = performance.now();
        let rafId = null;
        let lowFpsStreak = 0;
        let highFpsStreak = 0;
        let lastModeChangeTime = 0;
        let isPerformanceMode = false;

        function getCurrentMode() {
            return localStorage.getItem('performance_mode') === 'true' || document.body.classList.contains('performance-mode');
        }

        function setPerformanceMode(enable) {
            if (enable === isPerformanceMode) return;
            const now = Date.now();
            if (now - lastModeChangeTime < CHECK_DELAY_AFTER_CHANGE) return;
            isPerformanceMode = enable;
            lastModeChangeTime = now;
            localStorage.setItem('performance_mode', enable);
            if (enable) document.body.classList.add('performance-mode');
            else document.body.classList.remove('performance-mode');
            const btn = document.getElementById('perf-toggle');
            if (btn) enable ? btn.classList.add('active') : btn.classList.remove('active');
        }

        function frameCallback(now) {
            const delta = Math.min(100, now - lastFrameTime);
            if (delta > 0) {
                const fps = 1000 / delta;
                fpsSamples.push(fps);
                if (fpsSamples.length > 60) fpsSamples.shift();
            }
            lastFrameTime = now;
            rafId = requestAnimationFrame(frameCallback);
        }

        function analyzePerformance() {
            if (fpsSamples.length === 0) {
                setTimeout(analyzePerformance, SAMPLE_INTERVAL_MS);
                return;
            }
            const avgFps = fpsSamples.reduce((a,b) => a + b, 0) / fpsSamples.length;
            if (avgFps < TARGET_FPS) {
                lowFpsStreak++;
                highFpsStreak = 0;
            } else {
                highFpsStreak++;
                lowFpsStreak = 0;
            }
            if (lowFpsStreak >= LOW_FPS_COUNT_THRESHOLD && !getCurrentMode()) setPerformanceMode(true);
            else if (highFpsStreak >= HIGH_FPS_COUNT_THRESHOLD && getCurrentMode()) setPerformanceMode(false);
            fpsSamples = [];
            setTimeout(analyzePerformance, SAMPLE_INTERVAL_MS);
        }

        function bindManualToggle() {
            const btn = document.getElementById('perf-toggle');
            if (!btn) return;
            const handler = () => {
                lowFpsStreak = 0;
                highFpsStreak = 0;
                lastModeChangeTime = Date.now();
                setTimeout(() => { lastModeChangeTime = 0; }, CHECK_DELAY_AFTER_CHANGE);
            };
            btn.addEventListener('click', handler);
            btn.addEventListener('touchstart', handler);
        }

        function start() {
            isPerformanceMode = getCurrentMode();
            lastModeChangeTime = Date.now();
            lastFrameTime = performance.now();
            rafId = requestAnimationFrame(frameCallback);
            setTimeout(analyzePerformance, 3000);
            bindManualToggle();
        }

        requestIdleCallback ? requestIdleCallback(start, { timeout: 1000 }) : setTimeout(start, 1000);
    });

    // Service Worker 缓存（延迟注册，完全不影响首次加载关键资源）
    runWhenReady(() => {
        if ('serviceWorker' in navigator && !window._swRegistered) {
            window._swRegistered = true;
            const swCode = `const CACHE_NAME='ak12_cache_v6';const urlsToCache=['/','/style.css','/13.js','/a1.js','/a2.js','/a3.js','/a4.js','/a5.js','/a游戏.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js','https://unpkg.com/comlink@4.4.1/dist/umd/comlink.min.js','https://image2url.com/r2/bucket1/images/1767924501264-882d54aa-2ff0-4d62-9a9a-a352455d8fba.jpg','https://image2url.com/r2/bucket2/images/1766739894913-d6018d51-9e56-4a5e-8c55-ae182f792e65.jpg','https://threejs.org/examples/textures/waternormals.jpg','/downloads/ak-12.glb','https://cdn.jsdelivr.net/gh/4TiyinG/45@main/Soldier.glb','https://cdn.jsdelivr.net/gh/4TiyinG/45@main/deng.glb','https://cdn.jsdelivr.net/gh/4TiyinG/45@main/hachune-miku-doll.glb','https://cdn.jsdelivr.net/gh/4TiyinG/45@main/guitar.glb'];self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(urlsToCache))));self.skipWaiting();self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));self.addEventListener('activate',e=>e.waitUntil(clients.claim()));`;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            requestIdleCallback(() => {
                navigator.serviceWorker.register(swUrl).then(() => setTimeout(() => URL.revokeObjectURL(swUrl), 1000)).catch(() => {});
            }, { timeout: 2000 });
        }
    });
})();
</script>
